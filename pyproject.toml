[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.8.0"
description = "Clips verticaux sous-titres pour TikTok a partir de videos longues YouTube et VOD Twitch"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp",
    "yt-dlp-ejs",
    "anthropic",
    "numpy",
    "scenedetect",
    "faster-whisper",
    "mediapipe",
    "fastapi",
    "uvicorn",
    "tomli-w",
    # accounts : coffre de l'OS (Gestionnaire d'identification Windows) pour les mots de passe.
    "keyring",
    # zoneinfo (clipper.channel) n'embarque pas la base IANA sur Windows.
    "tzdata; sys_platform == 'win32'",
    # render : titre d'ecran letterbox rasterise (Pillow) et couverture des polices (fonttools).
    "pillow",
    "fonttools",
    # browser : profils persistants par compte, vrai Chrome visible (connexion manuelle, cookies).
    "playwright",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-xdist>=3",
    "httpx",
]
# GPU (SPEC-38f7 R4) : CTranslate2 >= 4.8 (utilisé par faster-whisper) lie
# cuBLAS 12.x et cuDNN 9.x lui-même mais ne les installe pas (AGENTS.md,
# Pièges) ; bornes minimales compatibles avec ces versions. nvrtc (JIT CUDA)
# n'est pas dans cette liste : CTranslate2 n'utilise que des kernels CUDA
# précompilés, jamais de compilation à l'exécution.
cuda = [
    "nvidia-cublas-cu12>=12.0",
    "nvidia-cudnn-cu12>=9.0",
]

[project.scripts]
clipper = "clipper.__main__:main"

[tool.setuptools.packages.find]
include = ["clipper", "clipper.*"]

[tool.setuptools.package-data]
clipper = ["assets/**/*", "web/static/**/*"]

[tool.uv]
# mediapipe impose opencv-contrib-python ; scenedetect demande opencv-python (meme
# module cv2, ecrase l'autre selon l'ordre d'install). On ecarte opencv-python pour
# garder un seul paquet OpenCV installe : opencv-contrib-python, sur-ensemble de
# opencv-python, satisfait cv2 pour scenedetect comme pour mediapipe.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
# Suite CPU-bound (ADR-fb9b) : chaque test est isole (tmp_path, llm.use_backend,
# FakeBackend), donc distribuable sur les coeurs sans etat partage. -n auto
# (= os.cpu_count(), 12 coeurs logiques sur ce PC) sursouscrit le CPU sur une
# machine partagee avec d'autres sessions agent actives (flaky observe sur
# les tests de concurrence reelle avant leur correctif, cf. TASK-42a46cb23f78).
# -n 6 (coeurs physiques) laisse une marge CPU/RAM pour le reste du PC
# partage, au prix d'un gain moindre que -n auto.
# -n 8 (TASK-8f7c) non adopte : il exige 3 suites completes vertes consecutives
# et une RAM libre > 2 Go mesuree pendant ces suites, pas encore relevees ;
# -n 6 reste donc le reglage.
addopts = "-n 6"
# Ne garde que les dossiers temporaires des tests en echec (TASK-20f1) : une
# suite complete laissait ~19 Go dans le dossier temporaire (pytest-of-<user>).
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
