# Reperes et URL de YouTube Studio (SPEC-5e50 R4, ADR-58c0).
#
# Seul fichier ou vivent les adresses et les reperes de la page YouTube Studio :
# clipper/youtube.py n'en contient aucun. Un changement de page se corrige ici, sans toucher
# la logique. Meme forme que tiktok_selectors.toml.
#
# Chaque cle porte sa provenance :
#   « vérifié 2026-10-03 » = releve sur la vraie page (YouTube Studio en francais, ce jour-la) ;
#   « NON VÉRIFIÉ »        = ecrit sans releve reel : a confirmer sur la vraie page avant de s'y fier
#                            (jamais livre comme verifie, R4). Un repere introuvable arrete la verification.

version = 1

[urls]
# Page ouverte pour la connexion a la main et pour la verification « pret a publier ».
# vérifié 2026-10-03
studio = "https://studio.youtube.com"
# Adresse publique d'un Short ({id} = identifiant lu dans le lien affiche des l'etape Details).
# vérifié 2026-10-03
short = "https://youtube.com/shorts/{id}"

[expect]
# Connecte : l'adresse devient studio.youtube.com/channel/<UC...>/... ; le groupe capture l'identifiant de la chaine.
# vérifié 2026-10-03
channel_url_pattern = 'studio\.youtube\.com/channel/(UC[\w-]+)'
# Fragments d'adresse de la connexion Google (aussi ses pages de verification) : non connecte = pas pret.
# vérifié 2026-10-03
login_url_markers = ["accounts.google.com"]
# Fragments d'adresse des verifications Google (« confirmez votre identite ») : arret « verification », pas « login ».
# NON VÉRIFIÉ
verification_url_markers = ["/signin/challenge", "/speedbump", "/v3/signin/challenge"]
# Lien du Short affiche des l'etape Details : le groupe capture l'identifiant de la video.
# vérifié 2026-10-03
short_id_pattern = 'youtube\.com/shorts/([\w-]+)'
# Valeur d'un champ de date (« 4 oct. 2026 ») et d'un champ d'heure (« 00:00 ») de la section Programmer,
# reperes par leur valeur (les ids input-N sont instables).
# vérifié 2026-10-03
date_value_pattern = '^\d{1,2}\s+\S+\s+\d{4}$'
# vérifié 2026-10-03
time_value_pattern = '^\d{1,2}:\d{2}$'

[labels]
# La navigation affiche « Votre chaîne <nom de la chaine> ».
# vérifié 2026-10-03
channel_prefix = "Votre chaîne"
# Bouton d'ouverture du menu d'envoi (banniere) et entree de ce menu qui ouvre la dialog d'envoi : le chemin reel
# (l'URL /videos/upload redirige vers le tableau de bord, elle n'ouvre jamais la dialog), chemin confirme par
# clipper.browser sur la vraie page, releve des entrees : « Importer des vidéos », « Passer au direct »,
# « Nouvelle playlist », « Nouveau podcast ».
# vérifié 2026-10-03 (Chrome piloté)
create = "Créer"
# vérifié 2026-10-03 (Chrome piloté)
upload_menu = "Importer des vidéos"
# Libelles des boutons, radios et sections de la dialog d'envoi (YouTube Studio en francais, vérifié 2026-10-03).
next = "Suivant"
kids_yes = "Oui, elle est conçue pour les enfants"
kids_no = "Non, elle n'est pas conçue pour les enfants"
visibility_public = "Publique"
visibility_unlisted = "Non répertoriée"
visibility_private = "Privée"
expand_schedule = "Click to expand"
# Programmer un brouillon existant : entree « Contenus » du menu de gauche, onglet « Shorts », bouton de la ligne.
# vérifié 2026-10-27 (lecture seule).
content_nav = "Contenus"
shorts_tab = "Shorts"
draft_edit = "Modifier le brouillon"
timezone_button = "Fuseau horaire"
# Fuseau a choisir (texte de l'option contenant « Paris ») ; « Heure locale » = fuseau du PC : jamais (SPEC-5e50 R8).
timezone_wanted = "Paris"
timezone_forbidden = "Heure locale"
# Libelle du bouton final selon le mode : immediat public/non repertorie, immediat prive, programme.
final_publish = "Publier"
final_save = "Enregistrer"
final_schedule = "Programmer"

[selectors]
# Navigation de Studio (ARIA : navigation > img dont le nom est le nom de la chaine) ; son texte porte
# « Votre chaîne », puis le nom de la chaine sur la ligne suivante.
# vérifié 2026-10-03 : 1 élément sur la vraie page, inner_text « Votre chaîne », <nom>, « Tableau de bord »... (une ligne chacun)
navigation = "[role='navigation']"
# Champ de fichier de la dialog d'envoi (set_input_files).
# vérifié 2026-10-03
file_input = "input[type='file']"
# Entrees du menu ouvert par « Créer » (role ARIA menuitem) : « Importer des vidéos », « Passer au direct »,
# « Nouvelle playlist », « Nouveau podcast ».
# vérifié 2026-10-03 (Chrome piloté)
menu_item = "[role='menuitem']"
# Zones de texte de l'etape Details : 1re = titre, 2e = description (div#textbox role=textbox).
# vérifié 2026-10-03
text_box = "div#textbox[role='textbox']"
# Radio de la dialog, vise par libelle ({label}).
# NON VÉRIFIÉ
radio = "tp-yt-paper-radio-button:has-text(\"{label}\")"
# Bouton vise par libelle ({label}) : Suivant, Fuseau horaire.
# NON VÉRIFIÉ
labeled_button = "button:has-text(\"{label}\")"
# Section « Programmer » repliee : chevron #second-container-expand-button, nom accessible « Click to expand »
# (vérifié 2026-10-26 sur la dialog en français : un [aria-label] seul trouvait d'abord un autre controle cache).
expand = "#second-container-expand-button[aria-label=\"{label}\"]"
# Texte exact visé par libellé ({label}) : « Contenus », « Shorts ». vérifié 2026-10-27
exact_text = "text=\"{label}\""
# Ligne de la liste de Contenu (un brouillon y porte « Modifier le brouillon » ; titre tronque a ~100 caracteres).
# vérifié 2026-10-27
video_row = "ytcp-video-row"
# Bouton de la ligne d'un brouillon, vise par libelle ({label}) ; son clic rouvre la dialog d'envoi a l'etape Details.
# vérifié 2026-10-27
draft_button = "text={label}"
# Pastille de l'etape Visibilite de la dialog (4e pastille) : un clic y va directement. vérifié 2026-10-27
step_visibility = "#step-badge-3"
# Date de la section Programmer : depuis 2026-10-26 une liste deroulante (« 27 oct. 2026 ⌄ ») ; son declencheur affiche
# la date, un clic ouvre un calendrier qui porte un champ ou taper la date.
# vérifié 2026-10-27 (brouillon rouvert via Modifier le brouillon, rien enregistré) : ytcp-text-dropdown-trigger
# #datepicker-trigger, texte « 28 oct. 2026 » dans span.dropdown-trigger-text.
date_trigger = "ytcp-datetime-picker #datepicker-trigger"
# Champs texte de la section Programmer (heure « 00:00 », et date dans le calendrier ouvert) : input.tp-yt-paper-input,
# reperes par leur valeur. Heure : vérifié 2026-10-03 et 2026-10-27 ; champ de date du calendrier ouvert (valeur
# « 28 oct. 2026 », autofocus) : vérifié 2026-10-27, mais la saisie + Entree reste a prouver en reel.
text_input = "input.tp-yt-paper-input"
# Fuseau affiche une fois choisi : le bouton « Fuseau horaire » est remplace par une liste (role=button) dont le texte
# est « (UTC+01:00) Paris » (releve reel 2026-10-27, apres choix de Paris, avant le bouton final).
zone_shown = "ytcp-datetime-picker [role='button']"
# Options de la liste des fuseaux horaires : « (UTC+01:00) Paris » ; l'option retenue porte aria-selected="true"
# vérifié 2026-10-27, lecture seule.
timezone_option = "[role='option']"
# Bouton final de la dialog (Enregistrer, Publier ou Programmer selon le choix) ; son libelle est relu avant le clic.
# NON VÉRIFIÉ
final_button = "#done-button"
# Lien youtube.com/shorts/<id> affiche des l'etape Details.
# vérifié 2026-10-03
# 2026-10-27 : dans Contenu, la ligne du brouillon porte un autre lien youtube.com/shorts/ cache (#anchor-watch-on-yt) qui
# precede celui de la dialog : le sélecteur est donc fixé sur l'id du lien de la dialog. vérifié 2026-10-27
video_link = "a#video-link[href*='youtube.com/shorts/']"

[modal]
# Fenetre surgissante (role ARIA dialog) et son bouton, vise par libelle ({label}, sans guillemet double).
# NON VÉRIFIÉ
container = "[role='dialog']"
# NON VÉRIFIÉ
button = "button:has-text(\"{label}\")"

[popups]
# Fenetres connues : fragment de leur texte -> libelle du bouton qui les ferme. Toute autre fenetre = arret.
# Dialog « Bienvenue dans YouTube Studio » de la 1re visite, bouton « Continuer » (textes : vérifié 2026-10-03).
"Bienvenue dans YouTube Studio" = "Continuer"
# Rappel affiché à la 1re publication publique d'une chaîne, après le choix « Publique », par-dessus le bouton final
# (relevé 2026-10-26, capture state/browser/670ca85bf1f0/captures/20261026T110637-unexpected_page.png).
"tout le monde peut regarder les vidéos publiques" = "OK"

[calendar]
# Mois abreges tels que YouTube Studio (en francais) les affiche dans la date : « 4 oct. 2026 ».
# « oct. » est releve ; les 11 autres suivent l'usage francais, NON VÉRIFIÉ (un mois illisible arrete la publication).
months = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."]


[success]
# Titres de la fenetre affichee une fois la video envoyee : toute valeur de la liste du mode vaut preuve.
# « Vidéo mise en ligne » : vérifié 2026-10-03 (publique immediate).
# « Traitement de la vidéo » : relevé 2026-10-26 (1re publication publique d'une chaîne : publiée, publique dès la
# fin du traitement SD ; capture state/browser/670ca85bf1f0/captures/20261026T111018-publish_unconfirmed.png).
published = ["Vidéo mise en ligne", "Traitement de la vidéo"]
# NON VÉRIFIÉ : programmation et privee non relevees ; sans l'un de ces titres, arret « publish_unconfirmed » a verifier en reel.
scheduled = ["Vidéo programmée", "Vidéo planifiée"]
# NON VÉRIFIÉ
saved = ["Vidéo enregistrée"]

[detect]
# Presence d'un de ces elements = arret immediat (captcha, verification de compte). NON VÉRIFIÉ : jamais rencontres
# pendant le releve ; la connexion Google (adresse accounts.google.com) est deja couverte par [expect].
captcha = ["iframe[src*='recaptcha']", "#captcha-form"]
verification = ["#challenge", "[data-challengetype]"]
