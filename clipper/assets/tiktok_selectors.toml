# Selecteurs et URL de TikTok Studio (SPEC-9225 R5, ADR-1a58).
#
# Seul fichier ou vivent les adresses et les selecteurs de la page TikTok :
# clipper/tiktok.py n'en contient aucun. Un changement de page TikTok se corrige
# ici, sans toucher la logique.
#
# VERIFIE EN REEL (releve de TikTok Studio FR, 2026-10-01, page d'envoi, un seul cadre,
# TASK-d90f) : champ fichier, fin d'envoi (conteneur d'etat contenant « Importe »), legende
# (editeur Draft.js), « Afficher plus », visibilite (liste deroulante + id d'option),
# Maintenant / Programmer (radios, vises par libelle), champs heure et date, calendrier,
# selecteur d'heure, bouton final unique post_video_button (« Publier » ou « Programmer »),
# bouton d'abandon, et les deux fenetres surgissantes vues au premier envoi.
# VERIFIE EN REEL (meme jour, post prive de test, TASK-e4bf) : la confirmation apres publication
# (message « Video publiee » puis adresse /tiktokstudio/content), la fenetre « Continuer a publier ? »
# (boutons « Annuler » / « Publier maintenant »), le lien du post sur la page Publications
# (a[href*='/video/'], texte = legende), l'adresse directe d'analyse d'un post et ses cartes de
# metriques (data-tt VideoOverviewPage_VideoMetricsCard_FlexItem, texte « libelle | valeur »).
#
# A VERIFIER SUR LA VRAIE PAGE (jamais vu en reel) : la confirmation d'un post PROGRAMME (seule
# la navigation vers /tiktokstudio/content est attendue), la fenetre / bulle generique
# (modal.container), le texte du bloc « Verification de contenu simple » quand il signale un
# probleme (content_check_problem), le clic hors du champ qui ferme les selecteurs
# (schedule_picker_close), les cellules J'aime / Commentaires de la ligne de la page Publications
# ([stats] likes, comments : colonnes du tableau, pas de data-tt releve) et le bloc des sources de
# trafic ([stats] traffic_sources). Le test reel (CLIPPER_TIKTOK_REAL=1, tests/integration/
# test_tiktok_real.py) sert a les confirmer.
#
# VU SUR LA VRAIE PAGE SANS SELECTEUR CONFIRME (SPEC-86fe, releve FR du 2026-10-01) : les libelles de la page Donnees
# analytiques (tuiles, bouton de periode « 7 derniers jours »), du tableau Publications et des onglets Spectateurs /
# Engagement sont ceux de la page ; les reperes ([account] tile et menu des periodes, [stats] views, visibility, created,
# page_text) sont a confirmer sur la vraie page : tant qu'ils ne le sont
# pas, une valeur introuvable est relevee « null » ou arrete le releve (jamais devinee).
#
# Un selecteur est une chaine CSS/Playwright. Une liste (captcha, verification,
# connexion) est un ensemble de signes : un seul present suffit a arreter.

version = 1

[urls]
# Page d'envoi d'une video.
upload = "https://www.tiktok.com/tiktokstudio/upload?from=webapp"
# Liste des contenus publies (page Publications : lien du post, J'aime, Commentaires).
stats = "https://www.tiktok.com/tiktokstudio/content"
# Analyse d'un post, adresse directe ({post_id} = fin de l'adresse du post) : vues, temps de lecture...
analytics = "https://www.tiktok.com/tiktokstudio/analytics/{post_id}?qa_enter_from=analytics"
# Onglets Spectateurs et Engagement de l'analyse d'un post (SPEC-86fe R1).
analytics_viewers = "https://www.tiktok.com/tiktokstudio/analytics/{post_id}/viewers?qa_enter_from=analytics"
analytics_engagement = "https://www.tiktok.com/tiktokstudio/analytics/{post_id}/engagement?qa_enter_from=analytics"
# Page Donnees analytiques du compte (SPEC-86fe R1) : periode, tuiles vues / profil / j'aime / commentaires / partages.
analytics_account = "https://www.tiktok.com/tiktokstudio/analytics"

[expect]
# Apres l'ouverture de la page d'envoi, l'adresse courante doit commencer par ceci ;
# sinon la page est inattendue (redirection, erreur) : arret, jamais un clic au hasard.
upload_url_prefix = "https://www.tiktok.com/tiktokstudio/upload"
# Idem pour la page des statistiques : une autre adresse = page inattendue, arret.
stats_url_prefix = "https://www.tiktok.com/tiktokstudio/content"
# Preuve principale d'une publication : apres « Publier », l'adresse passe sur la page Publications.
published_url_prefix = "https://www.tiktok.com/tiktokstudio/content"
# Page d'analyse d'un post : une autre adresse = page inattendue, arret.
analytics_url_prefix = "https://www.tiktok.com/tiktokstudio/analytics/"
# Page Donnees analytiques du compte : une autre adresse = page inattendue, arret.
account_analytics_url_prefix = "https://www.tiktok.com/tiktokstudio/analytics"
# Fragments d'adresse qui disent « connexion expiree » (redirection vers la connexion).
login_url_markers = ["/login"]

[selectors]
# Zone de depot et bouton « Selectionner une video » (informatif : l'envoi passe par le champ fichier).
select_video_container = "[data-e2e='select_video_container']"
select_video_button = "button[data-e2e='select_video_button']"
# Champ fichier (cache : attendu « attached », pas « visible »).
file_input = "input[type='file']"
# Fin de l'envoi du mp4 : le conteneur d'etat affiche « Importe ».
upload_done = "[data-e2e='upload_status_container']:has-text('Importé')"
# Editeur de legende (Draft.js, contenteditable), pre-rempli du nom du fichier : vide puis
# tape touche par touche (jamais fill).
caption_editor = "[data-e2e='caption_container'] [contenteditable='true']"
# « Afficher plus » : deplie les parametres (clique seulement si la visibilite est repliee).
advanced_settings = "[data-e2e='advanced_settings_container']"
# Menu « Qui peut regarder cette video » ; options par id (0 Tout le monde, 2 Ami(e)s,
# 1 Toi uniquement = prive), le texte en secours.
visibility_dropdown = "[data-e2e='video_visibility_container'] button[role='combobox']"
visibility_public = "div[role='option'].Select__item[id$='option-\"0\"'], div[role='option']:has-text('Tout le monde')"
visibility_private = "div[role='option'].Select__item[id$='option-\"1\"'], div[role='option']:has-text('Toi uniquement')"
visibility_friends = "div[role='option'].Select__item[id$='option-\"2\"'], div[role='option']:has-text('Ami(e)s')"
# Reglages par post (SPEC-1ed3 R2), releves en reel le 2026-10-01 (FR) : ces blocs n'apparaissent qu'apres
# « Afficher plus ». « Autoriser les utilisateurs a » : deux cases input.Checkbox__input (« Commentaire »,
# « Reutilisation du contenu ») ; « Contenu genere par IA » : un interrupteur input[role='switch'].
# Chaque case est visee par le libelle le plus proche (comme content_check_switch), jamais par position.
comment_switch = "[data-e2e='user_perm_container'] >> text=\"Commentaire\" >> xpath=ancestor::div[.//input[contains(@class,'Checkbox__input')]][1]//input[contains(@class,'Checkbox__input')]"
reuse_switch = "[data-e2e='user_perm_container'] >> text=\"Réutilisation du contenu\" >> xpath=ancestor::div[.//input[contains(@class,'Checkbox__input')]][1]//input[contains(@class,'Checkbox__input')]"
ai_switch = "[data-e2e='aigc_container'] >> text=\"Contenu généré par IA\" >> xpath=ancestor::div[.//input[@role='switch']][1]//input[@role='switch']"
# Quand publier : deux radios aux ids aleatoires, vises par libelle.
schedule_now = "[data-e2e='schedule_container'] label:has-text('Maintenant'), [data-e2e='schedule_container'] [role='radio']:has-text('Maintenant')"
# Bouton radio dans un libelle (Maintenant / Programmer) : coche ou grise (video privee).
radio_input = "input[type='radio']"
schedule_later = "[data-e2e='schedule_container'] label:has-text('Programmer'), [data-e2e='schedule_container'] [role='radio']:has-text('Programmer')"
# Apres « Programmer » : deux champs, l'heure (valeur contenant « : ») puis la date (AAAA-MM-JJ).
schedule_inputs = "[data-e2e='schedule_container'] input.TUXTextInputCore-input"
# Nouvelle page Studio (releve reel 2026-10-26, compte ClippTVFR ; deploiement progressif par compte) : date et
# heure sont deux listes deroulantes div[role=combobox] (aria-label « Select date » / « Select time », valeur dans
# span.Picker__value : « 26 oct. 2026 », « 17:15 ») et un fuseau « (GMT+1) Heure locale » (champ de recherche
# d'une liste Select). schedule_fields : l'une ou l'autre page, attendue apres « Programmer ». Le contenu des listes
# ouvertes n'a pas ete capture : les choix sont supposes etre des [role='option'] (a confirmer au premier reel).
schedule_date_picker = "[data-e2e='schedule_container'] div[role='combobox'][aria-label='Select date']"
schedule_time_picker = "[data-e2e='schedule_container'] div[role='combobox'][aria-label='Select time']"
schedule_fields = "[data-e2e='schedule_container'] div[role='combobox'][aria-label='Select date'], [data-e2e='schedule_container'] input.TUXTextInputCore-input"
schedule_timezone = "[data-e2e='schedule_container'] .timezone-select input.Select__searchInput"
# Calendrier DatePicker de la liste date (releve reel 2026-10-26 17:19, portail div.Picker__panel.schedule-picker-panel) : titre
# mois / annee (boutons), fleches (1re = mois precedent, 2e = suivant), jours du mois affiche non grises seulement
# (data-outside=false : les jours du mois voisin sont aussi grises, disabled ; data-disabled=false : jours passes exclus).
datepicker_month = "div.schedule-picker-panel button.DatePicker__titleMonth"
datepicker_year = "div.schedule-picker-panel button.DatePicker__titleYear"
datepicker_nav = "div.schedule-picker-panel button.DatePicker__nav"
datepicker_day = "div.schedule-picker-panel button.DatePicker__day[data-outside='false'][data-disabled='false']"
picker_option = "[role='option']"
picker_value = "span.Picker__value"
# Calendrier : titres du mois et de l'annee, fleches (la 1re = mois precedent, la 2e = suivant),
# jours cliquables (texte exact).
calendar_month_title = "span.month-title"
calendar_year_title = "span.year-title"
calendar_arrow = "span.arrow"
calendar_day = "span.day.valid"
# Selecteur d'heure : colonne des heures (left) et des minutes (right), texte exact.
timepicker_hour = "span.tiktok-timepicker-option-text.tiktok-timepicker-left"
timepicker_minute = "span.tiktok-timepicker-option-text.tiktok-timepicker-right"
# Fermeture des selecteurs : clic hors du champ (coin du bloc « Quand publier », a l'ecart des radios).
schedule_picker_close = "[data-e2e='schedule_container']"
# Bloc « Verification de contenu simple » : « Verification en cours... » puis
# « Aucun probleme constate » (vert) ou un probleme signale.
content_check_running = "text=/Vérification en cours/"
content_check_ok = "text=/Aucun problème constaté/"
# Erreur rouge sous l'interrupteur (releve reel 2026-10-06, apres 15 min) : « Une erreur est survenue. Merci de
# reessayer plus tard. » + lien « Reessayer » (vise par son texte).
content_check_error = "text=/Une erreur est survenue/"
content_check_retry = 'text=/^\s*Réessayer\s*$/'
# Limite quotidienne (releves reels 2026-10-04 et 2026-10-20) : « Tu as atteint la limite de verifications pour
# aujourd'hui. Reessaie demain. » sous l'interrupteur.
content_check_limit = "text=/limite de vérifications/i"
# :has-text ignore la casse et cherche un fragment : « Aucun problème constaté » contient « problème constaté ».
content_check_problem = "div:has-text('problème constaté'):not(:has-text('Aucun problème')), div:has-text('problème détecté'):not(:has-text('Aucun problème'))"
# Interrupteur de la verification de contenu : le libelle exact, puis l'interrupteur du bloc le plus proche.
content_check_switch = "text=\"Vérification de contenu simple\" >> xpath=ancestor::div[.//input[@role='switch']][1]//input[@role='switch']"
# Bouton final UNIQUE : son texte est « Publier » (maintenant) ou « Programmer » ([labels]).
post_button = "button[data-e2e='post_video_button']"
# Abandon du brouillon (non utilise : un arret laisse la page telle quelle, avec sa capture).
discard_button = "button[data-e2e='discard_post_button']"
# Preuve de secours d'une publication : le message « Video publiee », ou la fenetre « Video programmee ! »
# d'un post programme (20/10 : affichee a la place de la navigation) ; la preuve principale est la navigation.
published_marker = "div:has-text('Vidéo publiée'), div:has-text('Vidéo programmée')"

[labels]
# Texte du bouton final selon le mode ; un autre texte = page inattendue, arret.
post_now = "Publier"
post_scheduled = "Programmer"
# Texte affiche par le menu de visibilite pour chaque choix : deja affiche = aucun clic.
visibility_public = "Tout le monde"
visibility_private = "Toi uniquement"
visibility_friends = "Ami(e)s"

[continue_publish]
# Fenetre « Continuer a publier ? » (verification de contenu encore en cours) : fragment de son texte
# et bouton a cliquer (jamais « Publier maintenant »).
dialog = "Continuer à publier"
cancel = "Annuler"

[calendar]
# Noms des mois affiches par le calendrier (langue de TikTok Studio : francais), janvier a decembre.
months = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"]
# Abreviations de la nouvelle page (« 26 oct. 2026 »), le point final est ignore.
months_short = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."]

[modal]
# Fenetres et bulles surgissantes (A VERIFIER : generique). Chacune doit etre connue ([popups]),
# sinon arret R4. Bouton : {label} est remplace par le libelle du [popups] (sans guillemet double).
# Un menu deroulant ouvert (visibilite...) porte aussi role=dialog : il contient des role=option, exclu. Le panneau de\n# programmation ouvert (div.Picker__panel.schedule-picker-panel : calendrier DatePicker de la date, liste de l'heure) est\n# aussi un role=dialog, dans un portail : c'est le selecteur lui-meme, pas une fenetre surgissante (releve 2026-10-26).
container = "[role='dialog']:not(:has([role='option'])):not(:has(.schedule-picker-panel)), [aria-modal='true']:not(:has([role='option'])):not(:has(.schedule-picker-panel)), .TUXModal-overlay:not(:has([role='option'])):not(:has(.schedule-picker-panel))"
button = "button:has-text(\"{label}\"), [role='button']:has-text(\"{label}\")"
# Fenetre « Activer les verifications automatiques du contenu ? » (releve reel 2026-10-08) : un TUXModal-overlay dans un
# portail, SANS role=dialog ni aria-modal (d'ou le 3e terme du conteneur). Fragment de son texte, pour signaler sa fermeture.
content_check_popup = "vérifications automatiques du contenu"

[popups]
# Fenetres connues : fragment du texte de la fenetre -> bouton a cliquer. Elles sont fermees et
# journalisees. Surtout pas « Activer » : le programme n'active rien a la place de l'utilisateur.
"Activer les vérifications automatiques du contenu" = "Annuler"
"Nouvelles fonctionnalités d'édition ajoutées" = "J'ai compris"
"Prévisualise ta vidéo sur ton téléphone" = "J'ai compris"

# Page Publications (SPEC-9225 R7) : une ligne = un post ; likes et commentaires sont lus dans la
# ligne du post (celle qui contient son lien). Une valeur que la page n'affiche pas (selecteur sans
# resultat) est relevee « null » ; une valeur affichee mais illisible arrete le releve (page inattendue).
[stats]
# Une ligne de la page Publications (verifie en reel 2026-10-02 : blocs div, pas de tableau HTML).
row = "[data-tt='components_RowLayout_FlexRow']:has(a[href*='/video/'])"
# Lien du post (/@<compte>/video/<id>, texte = legende) : sert a la ligne et a la recherche du lien apres publication.
post_link = "a[href*='/video/']"
# Cellules de la ligne (verifie en reel) : vues _6, j'aime _7, commentaires _8.
likes = "[data-tt='components_RowLayout_FlexRow_7']"
comments = "[data-tt='components_RowLayout_FlexRow_8']"
# Page d'analyse d'un post : une carte par metrique, texte « libelle | valeur ».
metric_card = "[data-tt='VideoOverviewPage_VideoMetricsCard_FlexItem']"
# Bandeau en haut de l'analyse d'un post restreint (verifie en reel 2026-10-04) : « Cette vidéo n'est pas éligible à la
# recommandation dans le fil d'actualité Pour toi... ». Classes generees (css-xxxx) : reperage par le TEXTE, FR et EN.
fyf_notice = "span:text-matches(\"pas éligible à la recommandation|not eligible for recommendation\", \"i\")"
# Bloc des sources de trafic (visibles a partir de 100 vues). A VERIFIER SUR LA VRAIE PAGE.
traffic_sources = "[data-tt='VideoOverviewPage_TrafficSourceCard_FlexRow']"
# Valeur affichee tant que TikTok n'a pas fini de calculer (retention, sources) : relevee « null ».
processing = "en cours de traitement"
# Cellules de la ligne de la page Publications (verifie en reel 2026-10-02) : vues _6, visibilite (bouton de la
# cellule de confidentialite), date affichee « 2 oct., 12:30 ». La legende est le texte du lien du post.
views = "[data-tt='components_RowLayout_FlexRow_6']"
visibility = "[data-tt='components_PrivacyCell_TUXButton']"
created = "[data-tt='components_PublishStageLabel_TUXText']"
# Points de la courbe de retention d'un post (texte « instant | part encore presente »). Releve reel 2026-10-06 : la
# courbe de la carte « Taux de retention » (VideoOverviewPage_RetentionCard) est un graphe echarts dessine en canvas sous
# une video, SANS element par point dans le DOM (seuls « 0:00 (100%) » et « 1:01 » en texte). Ce repere ne designe donc
# aucun element de la vraie page : la courbe est relevee « null », jamais devinee.
retention_point = "[data-tt='VideoOverviewPage_RetentionCard_Point']"
# Cartes des onglets Spectateurs et Engagement (verifie en reel 2026-10-06) : une carte = un bloc AnalyticsCard_CardWrapper,
# texte « titre, puis lignes » (un noeud texte par ligne). Spectateurs : « Total des spectateurs, 1.3K, +1, (contre...) » ;
# « Types de spectateurs » = les pourcentages d'une barre PUIS ses libelles ; Age / Sexe / Lieux = « libelle, valeur % »
# (« <1% » pour un pays sous 1 %). Engagement : « J'aime » (video + courbe, sans couples) et « Mots les plus utilises... ».
viewers_card = "[data-tt='components_AnalyticsCard_CardWrapper']"
engagement_card = "[data-tt='components_AnalyticsCard_CardWrapper']"
# Texte de la page, lu seulement quand les cartes manquent, pour reconnaitre un onglet « pas encore disponible ».
page_text = "body"
# Messages de TikTok quand un onglet n'a pas encore de chiffres : relevee « null » (jamais un 0 invente).
# Verifies en reel : « ...quand les vues de video atteindront le nombre de 100 » (carte Age/Sexe/Lieux sous 100 vues),
# « ...sont en cours de traitement » (carte), « Tu pourras voir ces informations quand suffisamment de donnees... » (carte
# Mots les plus utilises). Une carte qui en porte un est « null » ; l'onglet sans carte et avec l'un d'eux aussi.
unavailable = ["dès 100 vues", "en cours de traitement", "atteindront le nombre de 100", "Tu pourras voir ces informations"]
# Etat vide de la page Publications (compte sans aucun post). À VÉRIFIER EN RÉEL : sélecteur non connu, donc vide.
# Vide = on n'invente rien : le relevé attend les lignes quelques secondes ([tiktok] stats_empty_wait_s) puis rend 0 post.
# Renseigné = attendu en course avec les lignes (le relevé n'attend plus rien dès qu'il s'affiche).
empty_state = ""
# Un pas de defilement de la liste des Publications. Releve reel 2026-10-05 : la liste est VIRTUALISEE (le DOM ne garde que
# ~8 lignes de 100 px) et defile dans un conteneur interne (overflow auto), pas dans la fenetre. Le script descend ce conteneur
# de 80 % de sa hauteur visible et rend true quand le bas est atteint ; le relevé lit les lignes apres chaque pas et les cumule.
scroll_script = "(() => { let e = document.querySelector(\"a[href*='/video/']\"); while (e && !(e.scrollHeight > e.clientHeight + 5 && /auto|scroll/.test(getComputedStyle(e).overflowY))) e = e.parentElement; const box = e || document.scrollingElement; box.scrollTop += Math.max(100, Math.floor(box.clientHeight * 0.8)); return box.scrollTop + box.clientHeight >= box.scrollHeight - 2; })()"

# Libelle de chaque metrique de l'analyse d'un post (langue de TikTok Studio : francais).
[metrics]
views = "Vues de vidéo"
watch_total = "Temps de lecture total"
watch_avg = "Temps de visionnage moyen"
watched_full = "A regardé toute la vidéo"
new_followers = "Nouveaux followers"
retention = "Taux de rétention"

[detect]
# Signes de captcha (iframe/conteneur de verification).
captcha = [
  "#captcha-verify-container-main-page",
  "iframe[src*='captcha']",
  "div.captcha_verify_container",
]
# Signes de verification de compte (code, identite, telephone).
verification = [
  "[data-e2e='verify-identity']",
  "div:has-text('Verifier votre identite')",
]
# Signes d'un formulaire de connexion (session expiree).
login = [
  "form[data-e2e='login-form']",
  "[data-e2e='top-login-button']",
]

# Page Donnees analytiques du compte (SPEC-86fe R1, releve FR) : le bouton de periode affiche « 7 derniers jours »,
# chaque tuile est un bouton « libelle -- valeur (evolution) ». Une tuile ou une evolution absente (« -- ») = null.
# Menu des periodes verifie en reel (2026-10-02) : bouton data-tt DateRangeSelector_Button, options
# data-tt Select_Container dans la liste Select_FlexColumn (pas de role=option) : 7, 28, 60, 365 jours, Personnalise.
[account]
period_button = "[data-tt='components_DateRangeSelector_Button'], button:has-text('derniers jours')"
period_option = "[data-tt='components_Select_FlexColumn'] [data-tt='components_Select_Container']:has-text('{days} derniers jours')"
period_label = "{days} derniers jours"
tile = "button:not([disabled])"

# Libelle de chaque tuile du compte (langue de TikTok Studio : francais).
[tiles]
views = "Vues de la vidéo"
profile_views = "Vues du profil"
likes = "J'aime"
comments = "Commentaires"
shares = "Partages"

# Titres des cartes de l'onglet Spectateurs d'un post (TikTok Studio, FR).
[viewers]
total = "Total des spectateurs"
types = "Types de spectateurs"
age = "Âge"
gender = "Sexe"
locations = "Lieux"

# Titres des cartes de l'onglet Engagement d'un post (TikTok Studio, FR).
[engagement]
likes_over_time = "J'aime dans le temps"
comment_words = "Mots les plus utilisés dans les commentaires"
shares = "Partages"
