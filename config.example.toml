# Copier ce fichier vers config.toml puis ajuster.

# review : aucun rendu final sans decision humaine enregistree.
# auto   : pipeline autonome, file d'attente sur echec transitoire,
#          le controle qualite (etape qa) remplace la revue humaine.
mode = "review"

# Racine des dossiers de travail par video (workspace/<video_id>/).
workspace_dir = "workspace"

# Racine des clips rendus.
output_dir = "output"

# Chaque etape du pipeline (module clipper/x.py) peut declarer son propre
# dict CONFIG_DEFAULTS pour documenter les cles qu'elle accepte. Une table
# [x] ici est validee contre ce dict : cle absente de CONFIG_DEFAULTS
# refusee, section sans module clipper.x ou sans CONFIG_DEFAULTS refusee.
# Voir CONFIG_DEFAULTS dans le module clipper.x concerne pour la liste des
# cles disponibles, par exemple :
#
# [llm]
# backend = "claude-cli"
#
# [reframe]
# format = "letterbox"    # letterbox (zoom fixe, defaut) | crop (option figee)
# letterbox_zoom = 1.3     # fenetre centrale de largeur source_w / zoom
# layout = "stream_auto"   # letterbox (defaut) | stream_auto (facecam detectee, SPEC-3a88)
# stream_variant = "split" # top (defaut, inchange) | split (SPEC-76dc, webcam haut/jeu bas)
# # Webcam du stream trouvee par periode (Just Chatting puis jeu), TASK-5745 : rectangles candidats
# # numerotes dessines sur une planche, Claude (usage [llm.usages.facecam], modele rapide par defaut)
# # repond un numero ou « aucun ». Valeurs par defaut de CONFIG_DEFAULTS, a ne changer que si besoin :
# facecam_period_step = 60.0             # une image environ par minute pour reperer la fin du Just Chatting
# facecam_fullscreen_face_height = 0.25  # grand visage plein ecran : part de la hauteur de l'image
# facecam_candidate_frames = 24          # images de la periode ou chercher les rectangles candidats
# facecam_board_frames = 8               # images de la planche envoyee a Claude (6 a 8)
# facecam_candidate_max = 8              # nombre maximal de candidats numerotes
#
# [captions]
# screen_title_allow_emoji = false   # SPEC-6a86 (defaut) : titre d'ecran sobre, sans emoji
#
# [tiktok]   # releves de statistiques (SPEC-47e2) : seulement quand on se sert de Clipper
# stats_stale_min = 60      # ecran Statistiques : releve a l'ouverture si le dernier a plus de N minutes (0 = jamais)
# stats_detail_max = 30     # detail (3 pages par video) seulement pour les N videos les plus recentes ; « Releve complet » : sans plafond
# stats_interval_h = 0      # releve periodique du worker toutes les N heures ; 0 = coupe (defaut), negatif refuse
# stats_scroll_rounds = 10  # limite de securite du defilement de la liste des posts (atteinte : releve arrete, journalise)
# stats_empty_wait_s = 8    # attente de la liste avant de conclure « aucun post » (compte neuf)

# [repartition]  # plan du lendemain par compte TikTok (SPEC-78dc) : prepare chaque soir par le worker, valide d'un clic, rien n'est cree avant
# enabled = true                 # false : le worker ne calcule rien
# state_dir = "state/repartition"  # un fichier <AAAA-MM-JJ>.json par jour planifie
# compute_time = "20:00"         # heure de Paris a partir de laquelle le plan du lendemain est calcule
# posts_per_day = 6              # posts vises par compte et par jour (publications deja prevues comprises)
# default_grid_start = "08:00"   # grille par defaut d'un compte sans creneau fixe ce jour-la
# default_grid_end = "22:00"     # derniere heure de la grille (incluse)
# default_grid_gap_min = 150     # ecart minimal (minutes) entre deux posts d'un meme compte
# account_stagger_min = 30       # decalage (minutes) de la grille entre comptes, par rang
# max_per_source = 2             # clips d'un meme jeu (sinon d'une meme VOD) par compte et par jour
# excluded_sources = []          # streamers (meta.json) ou styles jamais planifies, ex. ["nom_du_streamer"]
# prime_start = "18:00"          # creneaux du soir : les meilleurs clips
# prime_end = "22:00"            # fin des creneaux du soir (incluse)
# exploration_per_day = 1        # clips d'exploration au plus par jour, tous comptes confondus
# bonus_window_days = 7          # fenetre des posts releves qui servent au bonus d'une source
# bonus_min_age_h = 24           # age minimal (heures) d'un post releve pour compter : les vues mûrissent
# bonus_min_posts = 3            # posts releves d'une source au moins pour qu'elle ait un bonus
# bonus_points = 5.0             # amplitude maximale du bonus (points de score), vues reelles seulement
#
# [action]  # etape action (SPEC-b0f3, ADR-4e57) : passages d'action des VOD gaming (pics audio, plans, images decrites par le LLM)
# # Desactivee par defaut : action.json vide, aucun appel LLM, scenes.json inchange. Activee (style gaming
# # action), elle pilote aussi les fenetres de pics hors parole de l'etape scenes ; relancer scenes --force.
# enabled = false
# window_seconds = 30          # fenetre d'analyse (s)
# step_seconds = 15            # pas entre deux fenetres (0 < pas <= fenetre)
# audio_weight = 1.0           # poids des pics audio dans le score d'une fenetre
# audio_peaks_full = 3         # pics audio d'une fenetre qui valent un signal complet
# audio_peak_min_db = 6.0      # un pic sous ce seuil (dB au-dessus du fond) ne compte pas
# cuts_weight = 1.0            # poids de la densite de changements de plan
# cuts_ratio_full = 3.0        # densite (multiple de la mediane de la video) qui vaut un signal complet
# min_score = 0.6              # score minimal d'une fenetre pour entrer dans un passage (0 < score <= 1)
# max_passage_seconds = 90     # un passage plus long est coupe (>= window_seconds)
# max_passages_per_hour = 12   # plafond de passages par heure de VOD
# frames_per_passage = 4       # images choisies par passage (jamais extraites ici : celles de scenes)
# max_images_per_hour = 48     # plafond d'images envoyees au LLM par heure de VOD
# batch_size = 8               # images par planche, un appel LLM par planche (usage « action », modele rapide)
# max_width = 768              # largeur max de chaque image de la planche
# parallel = 4                 # planches decrites en meme temps

# [youtube]  # comptes YouTube (SPEC-5e50) : YouTube Studio dans un vrai Chrome, un seul compte pilote a la fois
# max_posts_per_day = 3      # plafond de publications par compte et par jour
# min_gap_minutes = 120      # ecart minimal entre deux publications d'un compte
# min_action_delay_s = 0.3   # pause humaine entre deux actions sur la page
# max_action_delay_s = 1
# action_timeout_s = 30      # attente d'un element de la page (adresse de chaine, bouton...)
# poll_interval_s = 1        # pas d'attente entre deux lectures de la page
# publish_mode = "immediate" # immediate | scheduled (programme cote YouTube, PC eteint ensuite)
# visibility = "public"      # public | unlisted | private (une video programmee est toujours publique)
# made_for_kids = false      # « conçue pour les enfants » : non par defaut (reponse obligatoire de Studio)
# upload_timeout_s = 600     # attente de la fin de l'envoi du mp4 (lien du Short, bouton final actif)
# publish_confirm_timeout_s = 120  # attente de la fenetre « Vidéo mise en ligne » apres le clic final
# schedule_max_days = 30     # programmation la plus lointaine acceptee ; au-dela Clipper garde la publication
# schedule_min_minutes = 15  # avance minimale d'une programmation
#
# Toute date ou heure saisie dans une page (TikTok comme YouTube) est en heure de Paris (Europe/Paris),
# quel que soit le fuseau du PC : le navigateur pilote est lance avec ce fuseau.
#
# [browser]
# pilot_wait_s = 300         # un seul compte pilote a la fois : attente du compte en cours avant d'echouer

# [network]  # pays de l'IP publique (TASK-30cc) : pastille en haut a droite de la console, garde du navigateur pilote
# expected_country = "FR"   # pays attendu (code ISO a deux lettres) ; modifiable dans Reglages > Reseau
# geo_url = "https://ipinfo.io/json"  # service HTTPS gratuit sans cle : rend ip, city, country, org
# cache_s = 60              # duree (s) pendant laquelle un pays connu est reutilise
# block_browser = true      # refuse d'ouvrir le navigateur pilote (publication, statistiques) hors du pays attendu ou si le pays est inconnu

# [journal]  # journal global de toutes les actions (TASK-8067), un fichier par jour sous logs/
# enabled = true            # desactive (tests isoles) : aucun handler, aucun dossier logs/
# dir = "logs"
# retention_days = 2        # purge au-dela de N jours, au demarrage et a chaque changement de jour
# level = "INFO"            # independant de la verbosite console (-v/-vv)
# exclude_paths = ["/static/", "/media/"]  # jamais journalises par le middleware web

# Reglages retenus apres le banc RTX 3050 4 Go (docs/benchmarks/rtx3050.md) :
# deja les valeurs par defaut de CONFIG_DEFAULTS, rappelees ici pour memoire,
# pas necessaire de les recopier dans un config.toml reel.
#
# [transcribe]
# model = "small"    # pic VRAM whisper mesure : 1,68 Go (marge large sur 4 Go)
#                    # ; large-v3-turbo banc a part (docs/benchmarks/whisper-modeles.md) :
#                    # meilleure qualite sur de la parole propre mais pic VRAM 3,29 Go
#                    # (marge insuffisante sur 4 Go) et resultat mitige sur le stream de
#                    # jeu (code-switching vers l'anglais) -> pas retenu par defaut, option
#                    # au cas par cas sur une video de parole propre seulement
# batch_size = 8     # BatchedInferencePipeline : ~4-5x plus rapide qu'en
#                    # sequentiel sur une video reelle, sans perte de mots
#                    # (docs/bench-whisper-vitesse.md)
